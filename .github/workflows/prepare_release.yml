name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Override version bump type (auto-detected if empty)"
        required: false
        type: choice
        options: ["", "patch", "minor", "major"]

permissions: {}

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@086dfa4efe372cfb6b375460a56e26a62a873d2e # 1.93.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: false
      - name: Run release update
        run: cargo xtask release update
      - name: Read version
        id: meta
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          branch: release/v${{ steps.meta.outputs.version }}
          title: "chore(release): v${{ steps.meta.outputs.version }}"
          body: |
            ## Release v${{ steps.meta.outputs.version }}

            This PR was auto-generated by `cargo xtask release update`.

            ### Checklist
            - [ ] CHANGELOG.md reviewed
            - [ ] Version numbers correct
            - [ ] CI passes
          labels: release
          commit-message: "chore(release): v${{ steps.meta.outputs.version }}"
