name: CI

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  test-ubuntu:
    name: Test Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: warm
          tools: wasm-bindgen-cli@0.2.114
      - run: rustup target add wasm32-unknown-unknown
      - name: Build wasm bindings # Required by kaiki_report's `ximgdiff` feature (include_bytes!)
        run: |
          cargo build --target wasm32-unknown-unknown --release -p kaiki_diff_wasm
          wasm-bindgen --target web --out-dir wasm/kaiki_diff_wasm/pkg target/wasm32-unknown-unknown/release/kaiki_diff_wasm.wasm
      - run: cargo run -p xtask -- download-fixtures
      - run: cargo ck --locked
      - run: cargo check -p kaiki_napi --locked
      - run: cargo test --workspace --exclude kaiki_napi
      - run: git diff --exit-code # Must commit everything

  test-ubuntu-aarch64:
    if: ${{ github.ref_name == 'main' }}
    name: Test Linux ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: warm-aarch64
          tools: wasm-bindgen-cli@0.2.114
      - run: rustup target add wasm32-unknown-unknown
      - name: Build wasm bindings
        run: |
          cargo build --target wasm32-unknown-unknown --release -p kaiki_diff_wasm
          wasm-bindgen --target web --out-dir wasm/kaiki_diff_wasm/pkg target/wasm32-unknown-unknown/release/kaiki_diff_wasm.wasm
      - run: cargo run -p xtask -- download-fixtures
      - run: cargo ck --locked
      - run: cargo test --workspace --exclude kaiki_napi
      - run: git diff --exit-code # Must commit everything

  test-mac: # Separate job to save a job on PRs
    if: ${{ github.ref_name == 'main' }}
    name: Test Mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: warm
          tools: wasm-bindgen-cli@0.2.114
      - run: rustup target add wasm32-unknown-unknown
      - name: Build wasm bindings
        run: |
          cargo build --target wasm32-unknown-unknown --release -p kaiki_diff_wasm
          wasm-bindgen --target web --out-dir wasm/kaiki_diff_wasm/pkg target/wasm32-unknown-unknown/release/kaiki_diff_wasm.wasm
      - run: cargo run -p xtask -- download-fixtures
      - run: cargo ck --locked
      - run: cargo test --workspace --exclude kaiki_napi
      - run: git diff --exit-code # Must commit everything

  test-windows:
    if: ${{ github.ref_name == 'main' }}
    name: Test Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: warm
      - run: cargo run -p xtask -- download-fixtures
      # No need for `cargo ck` because it's already checked in linux.
      # Default features don't require the wasm bindings, so no wasm build here.
      - run: cargo test --workspace --exclude kaiki_napi

  test-wasm:
    name: Test WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-changes
        id: filter
        with:
          packages: kaiki_diff_wasm
          paths: wasm/,Cargo.toml,Cargo.lock,rust-toolchain.toml,.github/
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
      - uses: ./.github/actions/setup-rust
        if: steps.filter.outputs.changed == 'true'
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: wasm
          tools: wasm-bindgen-cli@0.2.114
      - if: steps.filter.outputs.changed == 'true'
        run: rustup target add wasm32-unknown-unknown
      - if: steps.filter.outputs.changed == 'true'
        run: cargo test --target wasm32-unknown-unknown -p kaiki_diff_wasm

  test-napi:
    name: Test NAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-changes
        id: filter
        with:
          packages: kaiki_napi
          paths: napi/,Cargo.toml,Cargo.lock,rust-toolchain.toml,.github/
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
      - uses: ./.github/actions/setup-rust
        if: steps.filter.outputs.changed == 'true'
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: napi
      - uses: ./.github/actions/setup-node
        if: steps.filter.outputs.changed == 'true'
      - name: Install dependencies
        if: steps.filter.outputs.changed == 'true'
        working-directory: napi/kaiki
        run: pnpm install --frozen-lockfile
      - name: Build and test napi
        if: steps.filter.outputs.changed == 'true'
        working-directory: napi/kaiki
        run: |
          pnpm run build:debug
          pnpm test

  typos:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: crate-ci/typos@02ea592e44b3a53c302f697cddca7641cd051c3d # v1.45.0
        with:
          files: .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: lint
          components: clippy
          tools: wasm-bindgen-cli@0.2.114
      - run: rustup target add wasm32-unknown-unknown
      - name: Build wasm bindings # Required by kaiki_report's `ximgdiff` feature (include_bytes!)
        run: |
          cargo build --target wasm32-unknown-unknown --release -p kaiki_diff_wasm
          wasm-bindgen --target web --out-dir wasm/kaiki_diff_wasm/pkg target/wasm32-unknown-unknown/release/kaiki_diff_wasm.wasm
      - run: cargo lint
      - run: cargo clippy -p kaiki_napi -- --deny warnings

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: doc
          tools: wasm-bindgen-cli@0.2.114
      - run: rustup target add wasm32-unknown-unknown
      - name: Build wasm bindings
        run: |
          cargo build --target wasm32-unknown-unknown --release -p kaiki_diff_wasm
          wasm-bindgen --target web --out-dir wasm/kaiki_diff_wasm/pkg target/wasm32-unknown-unknown/release/kaiki_diff_wasm.wasm
      - run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"
