name: Release wasm

on:
  push:
    branches:
      - main
    paths:
      - wasm/kaiki_diff_wasm/package.json

permissions: {}

concurrency:
  group: release_wasm
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      changed: ${{ steps.check.outputs.version_changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-version
        id: check
        with:
          file-name: wasm/kaiki_diff_wasm/package.json
          diff-search: "true"

  publish-wasm:
    name: Build and Publish wasm
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: false
      - name: Install binaryen
        run: |
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_126/binaryen-version_126-x86_64-linux.tar.gz | tar xz -C /tmp
          echo "/tmp/binaryen-version_126/bin" >> "$GITHUB_PATH"

      - uses: taiki-e/install-action@a164de717a0ee9284c2d9db1c6016a4c339cd333 # v2.69.14
        with:
          tool: wasm-bindgen-cli@0.2.114
      - name: Build wasm
        run: |
          cargo build --target wasm32-unknown-unknown --release -p kaiki_diff_wasm
          wasm-bindgen --target web --out-dir wasm/kaiki_diff_wasm/pkg target/wasm32-unknown-unknown/release/kaiki_diff_wasm.wasm
          wasm-opt --all-features -O -o wasm/kaiki_diff_wasm/pkg/kaiki_diff_wasm_bg.wasm wasm/kaiki_diff_wasm/pkg/kaiki_diff_wasm_bg.wasm

      - name: Patch package.json
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          cd wasm/kaiki_diff_wasm/pkg
          node -e "
            const pkg = require('./package.json');
            pkg.name = '@kaiki/diff-wasm';
            pkg.version = process.env.VERSION;
            pkg.license = 'MIT';
            pkg.repository = { type: 'git', url: 'https://github.com/re-taro/kaiki' };
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish
        working-directory: wasm/kaiki_diff_wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --provenance --access public --no-git-checks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: wasm-v${{ needs.check-version.outputs.version }}
          name: wasm v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
